services:
    pgsql:
        image: postgres:16-alpine
        container_name: ragify-pgsql
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-change_api}
            POSTGRES_USER: ${DB_USERNAME:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
            POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-trust}
        ports:
            - "${DB_PORT:-5432}:5432"
        volumes:
            - pgsql_data:/var/lib/postgresql/data
        networks:
            - ragify_network
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-change_api}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    pgsql_data:
        driver: local

networks:
    ragify_network:
        driver: bridge
